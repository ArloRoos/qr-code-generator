plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.testng:testng:7.12.0'
}

test {
    useTestNG() {
        excludeGroups 'convert'
    }
    testLogging {
        showStandardStreams = true
    }
}

tasks.named("test") {
    doLast {
        def path = "file://${buildDir}\\reports\\tests\\test\\index.html"

        println "\nTest run completed: html report available at ${path}"
    }
}